name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Continuous Integration (Build & Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Tests
        run: |
          pytest tests/

      - name: Build Application Package
        run: |
          python -m compileall src/

  deploy:
    name: Continuous Deployment
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Production Credentials
        run: |
          echo "Configuring environment with deployment secrets..."
        env:
          DEPLOY_ENV: production
          DEPLOY_KEY: ${{ secrets.DEPLOY_API_KEY }}

      - name: Execute Deployment
        run: |
          echo "Deploying application to production server..."
          # Replace with actual deployment target (e.g., AWS S3/EC2, Docker Hub, Vercel, or SSH command):
          # rsync -avz src/ user@server:/var/www/app
          echo "Deployment completed successfully."
